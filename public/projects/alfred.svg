<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAlfred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgAlfred)"/>
  <rect x="30" y="30" width="540" height="320" rx="8" fill="#131722" stroke="#242c3f" stroke-width="1.5"/>
  <!-- Top Bar -->
  <line x1="30" y1="65" x2="570" y2="65" stroke="#242c3f" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="4.5" fill="#38435d"/>
  <circle cx="66" cy="48" r="4.5" fill="#38435d"/>
  <circle cx="82" cy="48" r="4.5" fill="#38435d"/>
  <text x="300" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1" text-anchor="middle">ALFRED AI — DEVELOPER API &amp; LLM GATEWAY CONCEPT</text>

  <!-- Left: Neural Network / Agent Nodes -->
  <rect x="55" y="85" width="220" height="240" rx="6" fill="#181e2b" stroke="#2b354b" stroke-width="1"/>
  <text x="75" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Model Routing Topology</text>
  
  <!-- Neural graph nodes -->
  <!-- Layer 1 -->
  <circle cx="95" cy="155" r="9" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="95" cy="210" r="9" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="95" cy="265" r="9" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Layer 2 -->
  <circle cx="165" cy="180" r="11" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="165" cy="240" r="11" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>

  <!-- Layer 3 -->
  <circle cx="235" cy="210" r="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>

  <!-- Connections -->
  <line x1="104" y1="155" x2="154" y2="180" stroke="#334155" stroke-width="1"/>
  <line x1="104" y1="210" x2="154" y2="180" stroke="#334155" stroke-width="1"/>
  <line x1="104" y1="210" x2="154" y2="240" stroke="#334155" stroke-width="1"/>
  <line x1="104" y1="265" x2="154" y2="240" stroke="#334155" stroke-width="1"/>
  <line x1="176" y1="180" x2="223" y2="210" stroke="#475569" stroke-width="1.5"/>
  <line x1="176" y1="240" x2="223" y2="210" stroke="#475569" stroke-width="1.5"/>

  <text x="165" y="300" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">STREAM_TOKENS: OK</text>

  <!-- Right: API Console -->
  <rect x="290" y="85" width="255" height="240" rx="6" fill="#181e2b" stroke="#2b354b" stroke-width="1"/>
  <text x="310" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">REST API Request Flow</text>

  <rect x="305" y="130" width="225" height="180" rx="4" fill="#0f141e" stroke="#202737" stroke-width="1"/>
  <text x="320" y="152" fill="#38bdf8" font-family="monospace" font-size="10">POST /v1/alfred/complete</text>
  <text x="320" y="172" fill="#64748b" font-family="monospace" font-size="9">Content-Type: application/json</text>
  <text x="320" y="195" fill="#e2e8f0" font-family="monospace" font-size="9">{</text>
  <text x="335" y="212" fill="#e2e8f0" font-family="monospace" font-size="9">"model": "deep-reasoner-v1",</text>
  <text x="335" y="229" fill="#e2e8f0" font-family="monospace" font-size="9">"context": "enterprise_repo",</text>
  <text x="335" y="246" fill="#e2e8f0" font-family="monospace" font-size="9">"stream": true</text>
  <text x="320" y="263" fill="#e2e8f0" font-family="monospace" font-size="9">}</text>
  <text x="320" y="292" fill="#34d399" font-family="monospace" font-size="9">&gt; HTTP 200 (14.2ms) [READY]</text>
</svg>
