<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVantrel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1a1b1e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgVantrel)"/>
  <rect x="30" y="30" width="540" height="320" rx="8" fill="#17181c" stroke="#2c2d33" stroke-width="1.5"/>
  <!-- Top Bar -->
  <line x1="30" y1="65" x2="570" y2="65" stroke="#2c2d33" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="4.5" fill="#42444d"/>
  <circle cx="66" cy="48" r="4.5" fill="#42444d"/>
  <circle cx="82" cy="48" r="4.5" fill="#42444d"/>
  <text x="300" y="52" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1" text-anchor="middle">VANTREL — ASP.NET CORE MVC E-COMMERCE</text>

  <!-- Storefront wireframe -->
  <!-- Left: Sidebar Filters -->
  <rect x="55" y="85" width="120" height="240" rx="6" fill="#1e2026" stroke="#31343e" stroke-width="1"/>
  <text x="70" y="110" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">Categories</text>
  <line x1="70" y1="130" x2="155" y2="130" stroke="#373b47" stroke-width="2"/>
  <line x1="70" y1="150" x2="140" y2="150" stroke="#373b47" stroke-width="2"/>
  <line x1="70" y1="170" x2="150" y2="170" stroke="#373b47" stroke-width="2"/>
  <text x="70" y="210" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">Filters</text>
  <line x1="70" y1="230" x2="145" y2="230" stroke="#373b47" stroke-width="2"/>
  <line x1="70" y1="250" x2="130" y2="250" stroke="#373b47" stroke-width="2"/>
  <rect x="70" y="280" width="90" height="25" rx="4" fill="#31343e"/>
  <text x="115" y="296" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Reset Filters</text>

  <!-- Right: Products Grid -->
  <rect x="190" y="85" width="355" height="240" rx="6" fill="#1e2026" stroke="#31343e" stroke-width="1"/>
  <text x="210" y="110" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="600">Featured Catalog &amp; Cart Pipeline</text>

  <!-- Product item 1 -->
  <rect x="210" y="125" width="100" height="120" rx="4" fill="#17181c" stroke="#2c2d33" stroke-width="1"/>
  <rect x="220" y="135" width="80" height="55" rx="3" fill="#252730"/>
  <line x1="220" y1="202" x2="280" y2="202" stroke="#4a4e5d" stroke-width="2"/>
  <rect x="220" y="215" width="80" height="18" rx="3" fill="#3b82f6" opacity="0.8"/>
  <text x="260" y="227" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Add to Cart</text>

  <!-- Product item 2 -->
  <rect x="320" y="125" width="100" height="120" rx="4" fill="#17181c" stroke="#2c2d33" stroke-width="1"/>
  <rect x="330" y="135" width="80" height="55" rx="3" fill="#252730"/>
  <line x1="330" y1="202" x2="390" y2="202" stroke="#4a4e5d" stroke-width="2"/>
  <rect x="330" y="215" width="80" height="18" rx="3" fill="#3b82f6" opacity="0.8"/>
  <text x="370" y="227" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Add to Cart</text>

  <!-- Product item 3 -->
  <rect x="430" y="125" width="100" height="120" rx="4" fill="#17181c" stroke="#2c2d33" stroke-width="1"/>
  <rect x="440" y="135" width="80" height="55" rx="3" fill="#252730"/>
  <line x1="440" y1="202" x2="500" y2="202" stroke="#4a4e5d" stroke-width="2"/>
  <rect x="440" y="215" width="80" height="18" rx="3" fill="#3b82f6" opacity="0.8"/>
  <text x="480" y="227" fill="#ffffff" font-family="sans-serif" font-size="8" text-anchor="middle">Add to Cart</text>

  <!-- Bottom database status -->
  <rect x="210" y="260" width="320" height="48" rx="4" fill="#17181c" stroke="#2c2d33" stroke-width="1"/>
  <text x="225" y="280" fill="#9ca3af" font-family="sans-serif" font-size="9">Structured Relational Database (SQL Server)</text>
  <text x="225" y="296" fill="#10b981" font-family="monospace" font-size="9">✔ ACID Transactions · EF Core Migrations Active</text>
</svg>
